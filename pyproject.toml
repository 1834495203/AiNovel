[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ainovel"
version = "0.1.0"
description = "Versioned, character-aware novel writing workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "pgvector>=0.3.6,<1", "redis>=5.2,<7",
  "httpx>=0.28,<1", "jieba>=0.42.1,<1", "rank-bm25>=0.2.2,<1", "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]

[project.scripts]
ainovel = "ainovel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ainovel = ["web/*", "web/ui/*", "web/ui/assets/*", "prompts/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
