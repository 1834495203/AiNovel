<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>故事讨论 · 纸间</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/process-records.css"><link rel="stylesheet" href="/assets/discussion.css"><script type="module" src="/assets/discussion.js"></script></head>
<body><header><a class="brand" href="/">纸间<span>故事讨论</span></a><a id="return-story" href="/">返回小说</a><button id="theme-toggle">☾ 暗黑</button></header>
<main class="discussion-layout"><aside class="discussion-sidebar"><button id="new-discussion">＋ 新讨论</button><nav id="discussion-sessions" aria-label="讨论会话"></nav><p class="hint">每轮读取最新故事。讨论与设定修改不会改写正文。</p></aside>
<section class="discussion-chat"><div class="discussion-heading"><div><h1 id="discussion-title">故事讨论</h1><p id="discussion-subtitle" class="hint">讨论剧情走向，推敲人物与世界。</p></div><button id="discussion-undo">撤回上一步</button></div>
<div id="discussion-messages" aria-live="polite"></div><div class="discussion-composer"><div id="discussion-status" role="status">准备好讨论你的故事</div><form id="discussion-form"><label class="sr-only" for="discussion-input">讨论内容</label><textarea id="discussion-input" rows="3" placeholder="聊聊后续剧情，或告诉 AI 想修改哪些设定……" required></textarea><button type="submit">发送 ↗</button></form><p class="hint">讨论想法不会自动保存为设定；明确要求修改时，AI 才会使用工具更新。</p></div></section></main><div id="toast" role="alert" hidden></div></body></html>
